hy:
  site:
    certificates:
      heading: "Իմ վկայականները"
      intro: "Սեղմեք նկարի վրա՝ վկայականը ամբողջ էկրանով դիտելու համար։"
      generic: "Ուսումնական վկայական՝ %{title} թեմայով։"
      open: "Դիտել վկայականը ամբողջ էկրանով՝ %{title}"
      zoom_hint: "Սեղմեք նկարի վրա՝ մեծացնելու համար"
      close: "Փակել"
      descriptions:
        hexlet_ru: "Hexlet-ի Ruby on Rails մասնագիտական դասընթաց՝ Ruby և Rails տեխնոլոգիաներով վեբ հավելվածների մշակման մասին։ Վկայականը տրվել է 2026 թվականի մայիսի 19-ին։"
        hexlet_en: "Hexlet-ի Ruby on Rails մասնագիտական դասընթացի ավարտի վկայականի անգլերեն տարբերակ, տրված 2026 թվականի մայիսի 19-ին։"
        bash: "Bash՝ հրամանային տողի, ֆայլերի և Linux-ում առաջադրանքների ավտոմատացման գործիքներ։"
        bootstrap: "Bootstrap՝ պատրաստի բաղադրիչներ և հարմարվողական ցանց՝ վեբ միջերեսների համար։"
        code_foundation: "Ծրագրավորման հիմունքներ՝ տրամաբանություն, տվյալների կառուցվածքներ և խնդիրների լուծում։"
        css: "CSS՝ էջերի ձևավորում, տարրերի ոճավորում և հարմարվողական դասավորություն։"
        deploy: "Deploy՝ հավելվածների հրապարակում և տեղակայման հիմունքներ։"
        git_github: "Git և GitHub՝ տարբերակների կառավարում, փոփոխությունների պատմություն և պահոցների հետ աշխատանք։"
        how_to_code: "Ծրագրավորման հիմնական սկզբունքներ և ալգորիթմական մտածողություն։"
        javascript_build: "JavaScript՝ վեբ էջերի ինտերակտիվ վարքի ստեղծում։"
        javascript: "JavaScript՝ տրամաբանություն և վեբ միջերեսի տարրերի հետ փոխազդեցություն։"
        jquery: "jQuery՝ DOM-ի, իրադարձությունների և բրաուզերի էֆեկտների հետ աշխատանք։"
        regexp: "Կանոնավոր արտահայտություններ՝ տեքստի որոնում, ստուգում և մշակում։"
        rails_advanced: "Ruby on Rails՝ սերվերային վեբ մշակման խորացված ուսումնասիրություն։"
        rails: "Ruby on Rails՝ MVC, երթուղիներ, մոդելներ և վեբ հավելվածներ։"
        ruby: "Ruby՝ օբյեկտակողմնորոշված ծրագրավորման լեզու։"
        sql_advanced: "SQL՝ հարցումների և աղյուսակների հետ աշխատանքի լրացուցիչ փորձ։"
        sql: "SQL՝ հարաբերական տվյալների բազաների հարցումներ և տվյալների մշակում։"
