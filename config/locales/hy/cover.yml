hy:
  site:
    cover:
      heading: "Ուղեկցող նամակ"
      greeting: "Բարև ձեզ։"
      intro: "Ես Գոռ Խաչատրյանն եմ՝ Ruby on Rails ծրագրավորող։ Ծրագրավորում ուսումնասիրում եմ 2020 թվականից և ավարտել եմ Hexlet-ի Ruby on Rails դասընթացը։ Բաց եմ հեռավար նախագծային աշխատանքների և թիմերի հետ համագործակցության համար։"
      stack: "Աշխատում եմ Ruby, Rails, Active Record, PostgreSQL տեխնոլոգիաներով, միգրացիաներով, մոդելների կապերով, ձևերով, CRUD-ով և REST API-ներով։ Օգտագործում եմ Git/GitHub, HTML, Bootstrap, Turbo և Minitest/RSpec։ JavaScript-ի իմացությունս բազային է։"
      portfolio: "Կոդի օրինակներ՝ GitHub Quality՝ ուսումնական Rails ծառայություն GitHub OAuth-ով պահոցների ստուգման համար, Classifieds՝ ուսումնական հայտարարությունների հարթակ մոդերացիայով և իրավունքների ստուգմամբ, Web Resume՝ անձնական Rails կայք։ Ելակետային կոդը՝ github.com/TheGor-365։"
      services_heading: "Ի՞նչ առաջադրանքներ կարող եմ կատարել։"
      services: "Ruby on Rails-ի սխալների ուղղում, փոքր փոփոխություններ, ձևեր և CRUD, PostgreSQL հարցումներ ու միգրացիաներ, REST API, թեստավորում և ռեֆակտորինգ։ Յուրաքանչյուր առաջադրանքի գնահատումը հիմնվում է իրական ծավալի և ընդունման չափանիշների վրա։"
      process_heading: "Ինչպե՞ս եմ կազմակերպում աշխատանքը։"
      process: "Սկզբում ճշտում եմ խնդիրը, մուտքային տվյալները, սպասվող արդյունքը և ժամկետները։ Այնուհետև առաջարկում եմ հստակ սահմանված պլան, կատարում փոփոխությունները և ստուգում դրանք թեստերով։ Արհեստական բանականությունն օգտագործում եմ որպես օժանդակ գործիք, իսկ արդյունքը ստուգում եմ կոդի և հավելվածի աշխատանքի միջոցով։"
      closing: "Պատրաստ եմ քննարկել առաջադրանքը, գնահատել աշխատանքի ծավալը և համաձայնեցնել պայմանները։ Պորտֆոլիոն և ելակետային կոդը հասանելի են GitHub-ում, իսկ կապի համար կարող եք օգտվել իմ մասնագիտական էջերից։"
      signature: "Հարգանքով՝ Գոռ Խաչատրյան։"
