hy:
  site:
    projects:
      heading: "Նախագծեր"
      intro: "Ուսումնական, անձնական և ենթակառուցվածքային նախագծեր, որոնք ներկայացնում են իրական մշակման աշխատանքները։ Գործառույթներն ու տեխնոլոգիաները նկարագրված են ելակետային կոդի և README ֆայլերի հիման վրա։ Հղումները տանում են GitHub. հրապարակային ցուցադրությունների հասանելիությունը առանձին ստուգված չէ։"
      repo_year: "Պահոցի ստեղծման տարեթիվ՝"
      features: "Հիմնական գործառույթները"
      technologies: "Տեխնոլոգիաներ"
      code: "Դիտել ելակետային կոդը GitHub-ում"
      quality_art: "GitHub Quality ուսումնական նախագծի գովազդային պատկեր"
      quality_caption: "Գովազդային պատկեր, ոչ թե հավելվածի սքրինշոթ"
      brand_art: "Gor Web Development-ի ապրանքանիշի նշան"
      brand_caption: "Web Resume նախագծի ապրանքանիշի նշան"
      categories:
        educational: "Ուսումնական նախագիծ"
        personal: "Անձնական նախագիծ"
        early: "Վաղ ուսումնական նախագիծ"
        infrastructure: "Ենթակառուցվածքային նախագիծ"
      items:
        quality:
          name: "GitHub Quality"
          description: "GitHub պահոցների կոդի որակի վերլուծության ծառայություն՝ ստուգումներ գործարկելու և արդյունքները դիտելու համար։"
          features:
            - "Մուտք GitHub OAuth-ով և օգտատիրոջ պահոցների միացում։"
            - "Ruby և JavaScript կոդի ստուգում RuboCop-ով և ESLint-ով։"
            - "Ստուգումների պատմություն՝ կարգավիճակ, commit SHA, դիտողությունների քանակ և վերլուծիչների արդյունքներ։"
        classifieds:
          name: "Classifieds — հայտարարությունների հարթակ"
          description: "Մոդերացիայով հայտարարությունների հավելված. օգտատերերը տեղադրում են հայտարարություններ, իսկ ադմինիստրատորը կառավարում է դրանց կարգավիճակները։"
          features:
            - "Հայտարարություններ՝ կատեգորիաներով, նկարներով և հեղինակի անձնական էջով։"
            - "Draft, moderation, published, rejected և archived կարգավիճակներ՝ AASM-ով։"
            - "Մուտքի իրավունքներ Pundit-ով, GitHub մուտք և կառավարման վահանակ։"
        blog:
          name: "Համատեղ բլոգ"
          description: "Ուսումնական Rails բլոգ, որտեղ գրանցված օգտատերերը հրապարակում են գրառումներ, մեկնաբանում և հավանում բովանդակությունը։"
          features:
            - "Գրանցում և նույնականացում Devise-ով։"
            - "Օգտատերերի հետ կապված գրառումներ, մեկնաբանություններ և հավանումներ։"
            - "RU/EN տեղայնացում, լեզվի փոխարկում և Turbo/Stimulus։"
        resume:
          name: "Web Resume — այս կայքը"
          description: "Անձնական Rails վեբ ռեզյումե՝ մշակողի պրոֆիլով, նախագծերով, վկայականներով և տեխնիկական ժամանակագրությամբ։"
          features:
            - "Բաժինների միջև նավարկում Turbo Frame-երով՝ առանց ամբողջ էջը վերբեռնելու։"
            - "Նախագծերի և փորձի տվյալների պահպանում Active Record-ով և PostgreSQL-ով։"
            - "Գործունեության և իրադարձությունների գծապատկերներ՝ Chartkick-ով և Groupdate-ով։"
        property:
          name: "Property Finder"
          description: "Անշարժ գույքի կատալոգ՝ օբյեկտների էջերով, օգտատերերի պրոֆիլներով և գործակալի հետ կապվելու հնարավորությամբ։"
          features:
            - "Գույքի հայտարարություններ՝ գնով, բնութագրերով, լուսանկարով և կարգավիճակով։"
            - "Devise գրանցում և գույքի կապը սեփականատիրոջ հաշվի հետ։"
            - "Վաճառքի և վարձակալության բաժանում, հաղորդագրություններ գործակալին՝ Action Mailer-ով։"
        runner:
          name: "AI Course Actions Runner"
          description: "Թույլատրված ավտոմատացման workflow-ների հանրային կատարիչ։ Սա փակ AI հարթակի հրապարակային միջերեսը չէ։"
          features:
            - "GitHub Actions-ի սահմանափակ առաջադրանքների կատարում։"
            - "Գործարկման ապացույցների կապում մասնավոր նախագծի կոնկրետ փոփոխությանը։"
            - "Լոգերի, գաղտնիքների և մասնավոր արտեֆակտների հրապարակման սահմանափակումներ։"
