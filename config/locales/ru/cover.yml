ru:
  site:
    cover:
      heading: "Сопроводительное письмо"
      greeting: "Здравствуйте!"
      intro: "Меня зовут Гор Хачатрян. Я Ruby on Rails-разработчик. Изучаю разработку с 2020 года, завершил обучение по Ruby on Rails в Hexlet. Рассматриваю удалённые проектные задачи и сотрудничество с командами."
      stack: "Работаю с Ruby, Rails, Active Record, PostgreSQL, миграциями, ассоциациями моделей, формами, CRUD и REST API. Использую Git/GitHub, HTML, Bootstrap, Turbo, Minitest/RSpec; JavaScript — на базовом уровне."
      portfolio: "Примеры кода: GitHub Quality — учебный Rails-сервис проверки репозиториев с GitHub OAuth; Classifieds — учебная доска объявлений с модерацией и проверкой прав; Web Resume — личный Rails-сайт. Исходники: github.com/TheGor-365."
      services_heading: "Какие задачи могу выполнить?"
      services: "Исправление ошибок Ruby on Rails, небольшие доработки, формы и CRUD, работа с PostgreSQL, запросами и миграциями, REST API, тесты и рефакторинг. Предлагаю оценивать каждый заказ по фактическому объёму и критериям приёмки."
