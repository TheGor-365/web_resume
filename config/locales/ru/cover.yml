      process: "Сначала уточняю проблему, входные данные, желаемый результат и сроки. Затем предлагаю ограниченный план, вношу изменения и проверяю их тестами. Использую ИИ как вспомогательный инструмент, но результат проверяю по коду и поведению приложения."
      closing: "Готов обсудить задачу, оценить трудозатраты и согласовать условия. Портфолио и исходники доступны на GitHub; для связи можно использовать мои рабочие профили."
      signature: "С уважением, Гор Хачатрян."
